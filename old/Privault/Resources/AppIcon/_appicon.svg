    <!-- 
       Transform-Erklärung für maximale Kompatibilität:
       1. translate(256, 256): Gehe zur Bildmitte.
       2. scale(1.1): Mach alles 10% größer.
       3. translate(-256, -236): Zentrieren.
    -->
    <g transform="translate(256, 256) scale(1.3) translate(-256, -236)">

        <!-- Das Schild (blau: #0572EC, grün: #057200) -->
        <path d="M256 430C256 430 400 350 400 170V100L256 40L112 100V170C112 350 256 430 256 430Z" fill="#057200"/>

        <!-- Kleiner Punkt -->
        <!--<circle cx="256" cy="130" r="25" fill="white"/>-->

        <!-- Das V-Schlüsselloch -->
        <path d="M256 360C256 360 340 300 340 180H172C172 300 256 360 256 360Z" fill="white"/>

        <!-- Der Text: priVault -->
        <text x="256" y="150"
              fill="white"
              font-family="Segoe UI, Verdana, Arial, sans-serif"
              font-weight="bold"
              font-size="50"
              text-anchor="middle"
              letter-spacing="-2">
            priVault
        </text>
    </g>
</svg>