name: privault
description: "Ein selbst-gehosteter Passwort-Manager für Desktop und Mobile"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Core & UI
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  get_it: ^7.6.7
  package_info_plus: ^8.0.0
  collection: ^1.18.0

  # Config & Secure Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  
  # Database
  drift: ^2.24.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.2

  # Cryptography
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  fast_rsa: ^3.6.1
  crypto: ^3.0.3
  uuid: ^4.3.3
  zxcvbn: 1.0.0

  # Image processing for Thumbnails
  image: ^4.3.0

  # Network
  dio: ^5.4.0

  # Biometrics & Files
  local_auth: ^2.2.0
  file_picker: ^8.0.0
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
