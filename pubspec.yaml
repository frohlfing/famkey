name: privault
description: "Ein selbst-gehosteter Passwort-Manager für Desktop und Mobile"
publish_to: 'none'

# Angezeigte App-Version + Buildnummer (Major.Minor.Patch+Build oder Major.Minor+Build)
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Core & UI
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  get_it: ^7.6.7
  package_info_plus: ^8.0.0
  collection: ^1.18.0
  intl: ^0.19.0

  # Config & Secure Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  
  # Database
  drift: ^2.24.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.2

  # Cryptography
  # Einmalig ausführen (baut BoringSSL für native Plattformen): `dart run webcrypto:setup`
  webcrypto: ^0.5.7 # schneller als cryptography und fast_rsa
  #cryptography: ^2.7.0
  #ast_rsa: ^3.6.1
  dargon2_flutter: ^3.3.0 # schneller als pointycastle
  #pointycastle: ^3.9.1
  crypto: ^3.0.3
  uuid: ^4.3.3
  zxcvbn: 1.0.0

  # Image processing for Thumbnails
  image: ^4.3.0

  # Network
  dio: ^5.4.0

  # Files
  local_auth: ^2.2.0
  file_picker: ^8.0.0
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  # Importformate (XML, Zip)
  xml: ^6.3.0
  archive: ^4.0.9

  # Riverpod
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Web/OPFS
  web: ^1.1.1

  # Renderer
  printing: ^5.13.4
  pdf: ^3.11.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.13
  riverpod_lint: ^3.1.3
  riverpod_generator: ^4.0.3
  mockito: ^5.4.4
  build_test: ^3.5.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"