<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamKey Sync Server</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0d1b2a;
      color: #dce8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    svg { width: 72px; height: 72px; filter: drop-shadow(0 0 18px rgba(96,125,139,.5)); margin-bottom: 18px; }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -.3px; color: #e8f4fb; margin-bottom: 8px; }
    p  { color: #90a8b8; font-size: 1rem; text-align: center; max-width: 340px; line-height: 1.5; }
    .status {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(76,175,146,.1);
      border: 1px solid rgba(76,175,146,.3);
      color: #4caf92;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: .82rem;
      font-weight: 600;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf92; }
  </style>
</head>
